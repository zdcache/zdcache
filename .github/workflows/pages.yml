name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site sources
        run: |
          mkdir -p _site_src
          cp -R site/. _site_src/
          cp -R docs/benchmark _site_src/benchmark
          {
            printf -- '---\nlayout: default\ntitle: ZDCache\n---\n{%% raw %%}\n'
            sed -E "s#\]\(([^)#:]+)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/main/\1)#g" README.md
            printf '\n{%% endraw %%}\n'
          } > _site_src/index.md
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
