  .tooltip .entry.hovered { color: var(--text-primary); text-decoration: underline; }
  caption { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-secondary); padding-top: 8px; }

  .tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .axis-title { fill: var(--text-muted); font-size: 11px; }
  .row-label { fill: var(--text-secondary); font-size: 12px; }
  .row-label.highlight { fill: var(--text-primary); font-weight: 600; }
  .value-label { fill: var(--text-secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tooltip {

  table { border-collapse: collapse; margin-top: 8px; font-size: 12px; font-variant-numeric: tabular-nums; background: var(--surface-1); }

  td:first-child, th:first-child { text-align: left; }

function benchmarkOf(chart) {
  return typeof chart.benchmark === "string" ? chart.benchmark : chart.benchmark?.[activeView.key];
}

function chartsOf(part) {
  return part.charts.filter(chart => chart.footprint || benchmarkOf(chart));
}

const SIZES = [...new Set(DATA.results.map(r => r.size).concat(DATA.footprint.map(f => f.size)))]
  .filter(size => size > 0).sort((a, b) => a - b).map(size => ({ size, label: size.toLocaleString("en-US") }));
const LARGEST = SIZES.length ? SIZES[SIZES.length - 1].size : 0;

let activeView = VIEWS[0];
let activeSize = SIZES[SIZES.length - 1];
const LAYOUTS = [{ key: "size", name: "At one size" }, { key: "scaling", name: "Across sizes" }];
let activeLayout = LAYOUTS[0];
const scaling = () => activeLayout.key === "scaling";
const openTables = new Set();

const UNITS = { "ns/op": "ns", "us/op": "µs", "ms/op": "ms", "ops/us": "M ops/s", "bytes": "B" };

function estimate(chart, subject, size) {
  if (chart.footprint) {
    const entry = DATA.footprint.find(f => f.subject === subject && f.size === size);
    return entry ? { score: entry.bytesPerEntry, low: null, high: null, unit: "bytes" } : null;
  }
  const result = DATA.results.find(r => r.benchmark === benchmarkOf(chart) && r.subject === subject && r.size === size);
  if (!result) return null;
  const metric = chart.metric ? result.secondary[chart.metric] : result.primary;
  return metric ? { score: metric.score, low: metric.low, high: metric.high, unit: result.unit } : null;
}

function sizeFor(part) {
  return part.sized ? activeSize.size : LARGEST;
}

function labelOf(part, row) {
  return part.title === "Search" && row.scan ? row.label + " (full scan)" : row.label;
}

function rowsFor(chart, part, size) {
  return activeView.rows
    .map(row => ({ row, value: estimate(chart, row.subject, size) }))
    .filter(entry => entry.value && entry.value.score > 0)
    .map(entry => ({ ...entry, label: labelOf(part, entry.row) }));
}

function measuredSizes(chart, part) {
  return SIZES.map(s => s.size).filter(size => rowsFor(chart, part, size).length);
}

function seriesFor(chart, part) {
  const sizes = measuredSizes(chart, part);
  return activeView.rows
    .map(row => ({ row, label: labelOf(part, row),
      points: sizes.map(size => ({ size, value: estimate(chart, row.subject, size) })).filter(p => p.value && p.value.score > 0) }))
    .filter(series => series.points.length);
}

function format(value, unit) {
  const suffix = UNITS[unit] ?? unit;
  if (unit === "bytes") return Math.round(value).toLocaleString("en-US") + " " + suffix;
  const digits = value < 1 ? 2 : value < 10 ? 1 : 0;
  return value.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits }) + " " + suffix;
}

const SVG = "http://www.w3.org/2000/svg";
function el(name, attributes = {}, parent) {
  const node = document.createElementNS(SVG, name);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
  if (parent) parent.appendChild(node);
  return node;
}

const NICE = [1, 2, 5];

function niceBelow(value) {
  const exponent = Math.floor(Math.log10(value));
  const factor = [...NICE].reverse().find(f => f * 10 ** exponent <= value) ?? 1;
  return factor * 10 ** exponent;
}

function niceAbove(value) {
  const exponent = Math.floor(Math.log10(value));
  const factor = NICE.find(f => f * 10 ** exponent >= value);
  return factor ? factor * 10 ** exponent : 10 ** (exponent + 1);
}

function logDomain(chart, part) {
  const sizes = part.sized ? SIZES.map(s => s.size) : [LARGEST];
  const values = sizes.flatMap(size => rowsFor(chart, part, size).flatMap(({ value }) => {
    return [value.score, value.high ?? value.score, value.low ?? value.score];
  }));
  const low = Math.log10(niceBelow(Math.min(...values) * 0.9));
  const high = Math.log10(niceAbove(Math.max(...values) * 1.1));
  return { low, high: high - low < 0.3 ? low + 1 : high };
}

function ticksFor(domain) {
  const decades = domain.high - domain.low;
  const factors = decades <= 2 ? NICE : [1];
  const ticks = [];
  for (let exponent = Math.floor(domain.low); exponent <= Math.ceil(domain.high); exponent++) {
    for (const factor of factors) {
      const value = factor * 10 ** exponent;
      const position = Math.log10(value);
      if (position >= domain.low - 1e-9 && position <= domain.high + 1e-9) ticks.push(value);
    }
  }
  return ticks;
}

const tickLabel = value => value >= 1e6 ? (value / 1e6) + "M" : value >= 1e3 ? (value / 1e3) + "k" : String(+value.toPrecision(3));

const tooltip = document.getElementById("tooltip");
function showTooltip(anchor, chart, entry, size) {
  tooltip.replaceChildren();
  const heading = document.createElement("div");
  heading.className = "heading";
  heading.textContent = `${entry.label} · ${chart.title} · ${size.toLocaleString("en-US")} entries`;
  const value = document.createElement("div");
  value.className = "value";
  value.textContent = format(entry.value.score, entry.value.unit);
  tooltip.append(heading, value);
  if (entry.value.low != null) {
    const range = document.createElement("div");
    range.className = "detail";
    range.textContent = `Forks ranged from ${format(entry.value.low, entry.value.unit)} to ${format(entry.value.high, entry.value.unit)}`;
    tooltip.appendChild(range);
  }
  const direction = document.createElement("div");
  direction.className = "detail";
  direction.textContent = chart.lowerIsBetter ? "Lower is better" : "Higher is better";
  tooltip.appendChild(direction);
  tooltip.style.display = "block";
  const box = tooltip.getBoundingClientRect();
  const left = anchor.x + 16 + box.width > window.innerWidth ? anchor.x - box.width - 16 : anchor.x + 16;
  tooltip.style.left = Math.max(8, left) + "px";
  tooltip.style.top = Math.max(8, Math.min(window.innerHeight - box.height - 8, anchor.y - box.height / 2)) + "px";
}
const hideTooltip = () => { tooltip.style.display = "none"; };

function showSizeTooltip(anchor, chart, size, entries, hovered) {
  tooltip.replaceChildren();
  const heading = document.createElement("div");
  heading.className = "heading";
  heading.textContent = `${chart.title} · ${size.toLocaleString("en-US")} entries · ${chart.lowerIsBetter ? "lower" : "higher"} is better`;
  tooltip.appendChild(heading);
  const sorted = [...entries].sort((a, b) => chart.lowerIsBetter ? a.value.score - b.value.score : b.value.score - a.value.score);
  for (const entry of sorted) {
    const line = document.createElement("div");
    line.className = "entry" + (entry.series.row.highlight ? " highlight" : "") + (entry.series === hovered ? " hovered" : "");
    const name = document.createElement("span");
    name.textContent = entry.series.label;
    const value = document.createElement("span");
    value.textContent = format(entry.value.score, entry.value.unit);
    line.append(name, value);
    tooltip.appendChild(line);
  }
  tooltip.style.display = "block";
  const box = tooltip.getBoundingClientRect();
  const left = anchor.x + 16 + box.width > window.innerWidth ? anchor.x - box.width - 16 : anchor.x + 16;
  tooltip.style.left = Math.max(8, left) + "px";
  tooltip.style.top = Math.max(8, Math.min(window.innerHeight - box.height - 8, anchor.y - box.height / 2)) + "px";
}

function spreadLabels(items, gap, top, bottom) {
  const sorted = [...items].sort((a, b) => a.y - b.y);
  for (let i = 0; i < sorted.length; i++) {
    sorted[i].labelY = Math.max(sorted[i].y, i ? sorted[i - 1].labelY + gap : top);
  }
  const overflow = sorted.length ? sorted[sorted.length - 1].labelY - bottom : 0;
  if (overflow > 0) {
    for (let i = sorted.length - 1; i >= 0; i--) {
      sorted[i].labelY = Math.min(sorted[i].labelY - overflow, i < sorted.length - 1 ? sorted[i + 1].labelY - gap : bottom);
    }
  }
}

function drawLines(card, chart, part) {
  const series = seriesFor(chart, part);
  if (!series.length) {
    const empty = document.createElement("p");
    empty.className = "direction";
    empty.textContent = "Not measured in this run.";
    card.appendChild(empty);
    return;
  }
  const sizes = measuredSizes(chart, part);
  const unit = series[0].points[0].value.unit;
  const scores = series.flatMap(s => s.points.map(p => p.value.score));
  const yLow = Math.log10(niceBelow(Math.min(...scores) * 0.9));
  const yHighRaw = Math.log10(niceAbove(Math.max(...scores) * 1.1));
  const domain = { low: yLow, high: yHighRaw - yLow < 0.3 ? yLow + 1 : yHighRaw };
  const labelWidth = Math.ceil(Math.max(...series.map(s => s.label.length)) * 6.4) + 24;
  const margin = { top: 24, right: labelWidth, bottom: 40, left: 52 };
  const width = Math.max(480, card.clientWidth - 32);
  const height = Math.max(300, series.length * 15 + margin.top + margin.bottom);
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = height - margin.top - margin.bottom;
  const xLow = Math.log10(sizes[0]), xHigh = Math.log10(sizes[sizes.length - 1]);
  const x = size => xHigh === xLow ? margin.left + plotWidth / 2
    : margin.left + (Math.log10(size) - xLow) / (xHigh - xLow) * plotWidth;
  const y = v => margin.top + (domain.high - Math.log10(v)) / (domain.high - domain.low) * plotHeight;

  const svg = el("svg", { width, height, viewBox: `0 0 ${width} ${height}`, tabindex: 0, role: "img",
    "aria-label": `${chart.title} across ${sizes.length} sizes, ${chart.lowerIsBetter ? "lower" : "higher"} is better. `
      + "Use the left and right arrow keys to read each size." }, card);
  for (const tick of ticksFor(domain)) {
    el("line", { x1: margin.left, x2: margin.left + plotWidth, y1: y(tick), y2: y(tick), stroke: "var(--grid)", "stroke-width": 1 }, svg);
    el("text", { x: margin.left - 8, y: y(tick) + 4, "text-anchor": "end", class: "tick" }, svg).textContent = tickLabel(tick);
  }
  for (const size of sizes) {
    el("text", { x: x(size), y: height - margin.bottom + 16, "text-anchor": "middle", class: "tick" }, svg).textContent = tickLabel(size);
  }
  el("line", { x1: margin.left, x2: margin.left + plotWidth, y1: margin.top + plotHeight, y2: margin.top + plotHeight,
    stroke: "var(--baseline)", "stroke-width": 1 }, svg);
  el("text", { x: margin.left, y: 12, class: "axis-title" }, svg).textContent = `${UNITS[unit] ?? unit} (log scale)`;
  el("text", { x: margin.left + plotWidth / 2, y: height - 6, "text-anchor": "middle", class: "axis-title" }, svg)
    .textContent = "Entries (log scale)";

  const crosshair = el("line", { y1: margin.top, y2: margin.top + plotHeight, stroke: "var(--baseline)", "stroke-width": 1, visibility: "hidden" }, svg);
  const ordered = [...series].sort((a, b) => Number(!!a.row.highlight) - Number(!!b.row.highlight));
  const drawn = new Map();
  for (const s of ordered) {
    const color = s.row.highlight ? "var(--series-1)" : "var(--other)";
    const group = el("g", {}, svg);
    el("polyline", { points: s.points.map(p => `${x(p.size)},${y(p.value.score)}`).join(" "), fill: "none", stroke: color,
      "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, group);
    for (const p of s.points) {
      el("circle", { cx: x(p.size), cy: y(p.value.score), r: 4, fill: color, stroke: "var(--surface-1)", "stroke-width": 2 }, group);
    }
    drawn.set(s, group);
  }
  const ends = series.map(s => {
    const last = s.points[s.points.length - 1];
    return { series: s, x: x(last.size), y: y(last.value.score) };
  });
  spreadLabels(ends, 14, margin.top, margin.top + plotHeight);
  const labelX = margin.left + plotWidth + 14;
  for (const end of ends) {
    if (Math.abs(end.labelY - end.y) > 2 || end.x < margin.left + plotWidth - 1) {
      el("line", { x1: end.x + 6, x2: labelX - 3, y1: end.y, y2: end.labelY, stroke: "var(--grid)", "stroke-width": 1 }, svg);
    }
    el("text", { x: labelX, y: end.labelY + 4, class: "series-label" + (end.series.row.highlight ? " highlight" : "") }, svg)
      .textContent = end.series.label;
  }

  let active = -1;
  function select(index, hovered) {
    active = index;
    const size = sizes[index];
    crosshair.setAttribute("x1", x(size));
    crosshair.setAttribute("x2", x(size));
    crosshair.setAttribute("visibility", "visible");
    drawn.forEach((group, s) => group.setAttribute("opacity", hovered && s !== hovered ? 0.25 : 1));
    const entries = series.map(s => ({ series: s, value: s.points.find(p => p.size === size)?.value })).filter(e => e.value);
    const box = svg.getBoundingClientRect();
    const anchorY = hovered ? y(entries.find(e => e.series === hovered)?.value.score ?? 0) : margin.top + plotHeight / 2;
    showSizeTooltip({ x: box.left + x(size), y: box.top + anchorY }, chart, size, entries, hovered);
  }
  function clear() {
    active = -1;
    crosshair.setAttribute("visibility", "hidden");
    drawn.forEach(group => group.setAttribute("opacity", 1));
    hideTooltip();
  }
  const hit = el("rect", { x: margin.left - 20, y: margin.top, width: plotWidth + 40, height: plotHeight, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", event => {
    const box = svg.getBoundingClientRect();
    const px = event.clientX - box.left, py = event.clientY - box.top;
    let index = 0;
    sizes.forEach((size, i) => { if (Math.abs(x(size) - px) < Math.abs(x(sizes[index]) - px)) index = i; });
    let hovered = null, distance = 12;
    for (const s of series) {
      const point = s.points.find(p => p.size === sizes[index]);
      if (point && Math.abs(y(point.value.score) - py) < distance) { distance = Math.abs(y(point.value.score) - py); hovered = s; }
    }
    select(index, hovered);
  });
  hit.addEventListener("pointerleave", clear);
  svg.addEventListener("keydown", event => {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    const step = event.key === "ArrowRight" ? 1 : -1;
    const start = active < 0 ? (step > 0 ? -1 : sizes.length) : active;
    select(Math.min(sizes.length - 1, Math.max(0, start + step)), null);
  });
  svg.addEventListener("blur", clear);
}

function scalingTables(part) {
  const fragment = document.createDocumentFragment();
  for (const chart of chartsOf(part)) {
    const sizes = measuredSizes(chart, part);
    const series = seriesFor(chart, part);
    if (!series.length) continue;
    const node = document.createElement("table");
    node.createCaption().textContent = chart.title;
    const head = node.createTHead().insertRow();
    for (const heading of ["", ...sizes.map(size => size.toLocaleString("en-US"))]) {
      const cell = document.createElement("th");
      cell.textContent = heading;
      head.appendChild(cell);
    }
    const body = node.createTBody();
    for (const s of series) {
      const tr = body.insertRow();
      tr.insertCell().textContent = s.label;
      for (const size of sizes) {
        const value = s.points.find(p => p.size === size)?.value;
        tr.insertCell().textContent = value ? format(value.score, value.unit) : "–";
      }
    }
    fragment.appendChild(node);
  }
  return fragment;
}

function drawChart(card, chart, part) {
  const size = sizeFor(part);
  const entries = rowsFor(chart, part, size);
  if (!entries.length) {
    const empty = document.createElement("p");
    empty.className = "direction";
    empty.textContent = "Not measured at this size.";
    card.appendChild(empty);
    return;
  }
  const domain = logDomain(chart, part);
  const rowHeight = 28;
  const labelWidth = Math.max(120, Math.ceil(Math.max(...entries.map(entry => entry.label.length)) * 6.9) + 20);
  const margin = { top: 6, right: 84, bottom: 40, left: labelWidth };
  const width = Math.max(380, card.clientWidth - 32);
  const plotWidth = width - margin.left - margin.right;
  const height = margin.top + entries.length * rowHeight + margin.bottom;
  const x = v => margin.left + (Math.log10(v) - domain.low) / (domain.high - domain.low) * plotWidth;
  const yOf = index => margin.top + index * rowHeight + rowHeight / 2;
  const unit = entries[0].value.unit;

  const svg = el("svg", { width, height, viewBox: `0 0 ${width} ${height}`, tabindex: 0, role: "img",
    "aria-label": `${chart.title}, ${size.toLocaleString("en-US")} entries, ${chart.lowerIsBetter ? "lower" : "higher"} is better. `
      + "Use the up and down arrow keys to read each row." }, card);

  for (const tick of ticksFor(domain)) {
    el("line", { x1: x(tick), x2: x(tick), y1: margin.top, y2: height - margin.bottom, stroke: "var(--grid)", "stroke-width": 1 }, svg);
    el("text", { x: x(tick), y: height - margin.bottom + 16, "text-anchor": "middle", class: "tick" }, svg).textContent = tickLabel(tick);
  }
  el("text", { x: margin.left + plotWidth / 2, y: height - 6, "text-anchor": "middle", class: "axis-title" }, svg)
    .textContent = `${UNITS[unit] ?? unit} (log scale)`;

  const marker = el("rect", { x: 0, width, height: rowHeight, fill: "var(--control)", visibility: "hidden", rx: 6 }, svg);

  entries.forEach((entry, index) => {
    const y = yOf(index);
    const color = entry.row.highlight ? "var(--series-1)" : "var(--other)";
    el("text", { x: margin.left - 12, y: y + 4, "text-anchor": "end", class: "row-label" + (entry.row.highlight ? " highlight" : "") }, svg)
      .textContent = entry.label;
    el("line", { x1: margin.left, x2: x(entry.value.score), y1: y, y2: y, stroke: "var(--grid)", "stroke-width": 1 }, svg);
    const { score, low, high } = entry.value;
    if (low != null && high > low) {
      el("line", { x1: x(low), x2: x(high), y1: y, y2: y, stroke: color, "stroke-width": 2, "stroke-linecap": "round", opacity: 0.45 }, svg);
    }
    el("circle", { cx: x(score), cy: y, r: 5, fill: color, stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
    el("text", { x: Math.max(x(score), x(high ?? score)) + 10, y: y + 4, class: "value-label" }, svg)
      .textContent = format(score, unit);
  });

  let active = -1;
  function select(index) {
    active = index;
    marker.setAttribute("y", yOf(index) - rowHeight / 2);
    marker.setAttribute("visibility", "visible");
    const box = svg.getBoundingClientRect();
    showTooltip({ x: box.left + x(entries[index].value.score), y: box.top + yOf(index) }, chart, entries[index], size);
  }
  function clear() {
    active = -1;
    marker.setAttribute("visibility", "hidden");
    hideTooltip();
  }
  const hit = el("rect", { x: 0, y: margin.top, width, height: entries.length * rowHeight, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", event => {
    const index = Math.floor((event.clientY - svg.getBoundingClientRect().top - margin.top) / rowHeight);
    if (index >= 0 && index < entries.length && index !== active) select(index);
  });
  hit.addEventListener("pointerleave", clear);
  svg.addEventListener("keydown", event => {
    if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
    event.preventDefault();
    const step = event.key === "ArrowDown" ? 1 : -1;
    const start = active < 0 ? (step > 0 ? -1 : entries.length) : active;
    select(Math.min(entries.length - 1, Math.max(0, start + step)));
  });
  svg.addEventListener("blur", clear);
}

function partTable(part) {
  const size = sizeFor(part);
  const node = document.createElement("table");
  const head = node.createTHead().insertRow();
  for (const heading of ["", ...chartsOf(part).map(chart => chart.title)]) {
    const cell = document.createElement("th");
    cell.textContent = heading;
    head.appendChild(cell);
  }
  const body = node.createTBody();
  for (const row of activeView.rows) {
    const values = chartsOf(part).map(chart => estimate(chart, row.subject, size));
    if (values.every(value => !value)) continue;
    const tr = body.insertRow();
    tr.insertCell().textContent = labelOf(part, row);
    for (const value of values) {
      tr.insertCell().textContent = !value ? "–"
        : format(value.score, value.unit) + (value.low != null
          ? ` (${format(value.low, value.unit)}–${format(value.high, value.unit)})` : "");
    }
  }
  return node;
}

function renderPage() {
  const container = document.getElementById("page");
  container.querySelectorAll("details").forEach(details => {
    if (details.open) openTables.add(details.dataset.part); else openTables.delete(details.dataset.part);
  });
  container.replaceChildren();
  document.getElementById("size-filter").hidden = scaling();
  document.getElementById("subtitle").textContent = activeView.subtitle;
  const key = document.getElementById("key");
  key.replaceChildren();
  for (const [name, color] of [[activeView.highlightName, "var(--series-1)"], [activeView.otherName, "var(--other)"]]) {
    const item = document.createElement("li");
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = color;
    const label = document.createElement("span");
    label.textContent = name;
    item.append(dot, label);
    key.appendChild(item);
  }

  const draws = [];
  for (const part of PARTS) {
    const section = document.createElement("section");
    section.className = "part";
    const heading = document.createElement("h2");
    heading.textContent = scaling() ? part.title : `${part.title}, ${activeSize.label} entries`;
    const text = document.createElement("p");
    text.textContent = part.text;
    const grid = document.createElement("div");
    grid.className = scaling() ? "grid wide" : "grid";
    section.append(heading, text, grid);
    for (const chart of chartsOf(part)) {
      const card = document.createElement("section");
      card.className = "card";
      const title = document.createElement("h3");
      title.textContent = chart.title;
      const direction = document.createElement("p");
      direction.className = "direction";
      direction.textContent = chart.lowerIsBetter ? "Lower is better" : "Higher is better";
      card.append(title, direction);
      grid.appendChild(card);
      draws.push(() => scaling() ? drawLines(card, chart, part) : drawChart(card, chart, part));
    }
    const details = document.createElement("details");
    details.dataset.part = part.title;
    details.open = openTables.has(part.title);
    const summary = document.createElement("summary");
    summary.textContent = "Table view";
    details.append(summary, scaling() ? scalingTables(part) : partTable(part));
    section.appendChild(details);
    container.appendChild(section);
  }
  draws.forEach(draw => draw());
}

function segmented(containerId, options, label, isActive, onSelect) {
  const group = document.getElementById(containerId);
  const buttons = options.map(option => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label(option);
    button.setAttribute("aria-pressed", String(isActive(option)));
    button.addEventListener("click", () => {
      buttons.forEach(other => other.setAttribute("aria-pressed", String(other === button)));
      onSelect(option);
      if (containerId === "views") history.replaceState(null, "", "#" + option.key);
      renderPage();
    });
    group.appendChild(button);
    return button;
  });
}

const fromHash = VIEWS.find(view => "#" + view.key === window.location.hash);
if (fromHash) activeView = fromHash;
segmented("views", VIEWS, view => view.name, view => view === activeView, view => { activeView = view; });
segmented("layouts", LAYOUTS, layout => layout.name, layout => layout === activeLayout, layout => { activeLayout = layout; });
segmented("sizes", SIZES, size => size.label, size => size === activeSize, size => { activeSize = size; });
renderPage();
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderPage, 150);
});
document.getElementById("note").textContent =
  (DATA.mode !== "full" ? `This is a ${DATA.mode} run, not a full run. ` : "")
  + `Run ${DATA.generatedAt} on Java ${DATA.javaVersion} with ${DATA.cpuCount} CPUs, ${DATA.forks.replace(" fork", " JMH fork")} `
  + "per measurement. Times are JMH averages per operation and throughput is "
  + "operations per microsecond (million per second); each value is the median of the per-fork averages and whiskers span the slowest and fastest fork. "
  + "No benchmark puts the caches under eviction pressure. Caffeine and cache2k do not evict in LRU order, Guava evicts "
  + "in LRU order per segment, Ehcache's heap tier by sampling and zdcache in strict LRU order by default. Guava gets 5% "
  + "extra capacity so its per-segment limits do not evict entries early. ConcurrentHashMap never evicts. Hazelcast runs "
  + "as one embedded member with objects stored as objects, without eviction because its per-partition limits would "
  + "evict early, and copies values on every read. CQEngine never evicts, plans the compound query over separate hash "
  + "and navigable indexes, and has its writes serialized with a lock. These numbers come from the author's "
  + "development machine; results vary with hardware, JVM, load and data shape.";
</script>
</body>
</html>
